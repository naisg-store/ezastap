        /* Core Theme Variables */

            --panel-bg: #18233c;
            --accent-blue: #00a2ff;
            --accent-cyan: #00d2ff;
            --text-light: #ecf0f1;
            --text-muted: #8a99ad;
            --border-color: #1e2d4a;
            --price-color: #4dc0b5;
            --accent-glow: rgba(0, 162, 255, 0.4);

        * {

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {

            color: var(--text-light);

            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;

        /* STICKY COLLAPSIBLE HEADER */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 15, 29, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }

        .brand-link img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-link span {
            color: var(--accent-cyan);
        }

        .nav-menu {
            display: flex;
            align-items: center;
        }

        .nav-list {
            display: flex;
            gap: 1.25rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {

            background: rgba(255, 255, 255, 0.05);

        .nav-link.active {
            color: var(--accent-cyan);
            background: rgba(0, 162, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.25);
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            flex-direction: column;
            gap: 5px;
        }

        .hamburger-bar {
            width: 24px;
            height: 2px;
            background-color: var(--text-light);
            border-radius: 2px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        @media (max-width: 768px) {
            .nav-toggle {
                display: flex;
            }

            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(10, 15, 29, 0.98);
                border-bottom: 1px solid var(--border-color);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-menu.open {
                max-height: 260px;
            }

            .nav-list {
                flex-direction: column;
                padding: 15px 20px;
                gap: 10px;
                width: 100%;
            }

            .nav-link {
                display: block;
                padding: 10px 14px;
            }

            .nav-toggle.active .hamburger-bar:nth-child(1) {
                transform: translateY(7px) rotate(45deg);
            }
            .nav-toggle.active .hamburger-bar:nth-child(2) {
                opacity: 0;
            }
            .nav-toggle.active .hamburger-bar:nth-child(3) {
                transform: translateY(-7px) rotate(-45deg);
            }
        }

        .hero-section {
            position: relative;
            width: 100%;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .parallax-video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .parallax-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            will-change: transform;
            transition: transform 0.05s linear;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10, 15, 29, 0.5) 0%, rgba(10, 15, 29, 0.88) 100%);
            z-index: 2;

        .hero-content {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 900px;
            padding: 25px 20px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 30px;

        .logo-wrapper {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 220px;
            max-width: 100%;
            height: auto;
            display: block;

        .hero-text {
            text-align: left;
            flex: 1;
        }

            color: var(--accent-blue);
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            opacity: 0.95;
        }

        @media (max-width: 650px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
                gap: 15px;
                padding: 30px 15px;
            }

            .hero-text {
                text-align: center;
            }

            .logo {
                width: 170px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }
        }

            max-width: 1300px;
            margin: 20px auto 50px auto;
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), 0 0 10px var(--accent-glow);
        }

        .image-container {
            width: 100%;
            height: 280px;
            position: relative;
            background-color: #111;
        }

        .image-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }
        
        .image-carousel::-webkit-scrollbar { display: none; }

        .carousel-item {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: bottom; 
            scroll-snap-align: start;
            cursor: zoom-in;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            backdrop-filter: blur(2px);
            transition: background 0.2s;

        .nav-btn.prev { left: 8px; }
        .nav-btn.next { right: 8px; }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(0,0,0,0.8);
            color: var(--price-color);

            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            border: 1px solid var(--price-color);
            z-index: 4;
            backdrop-filter: blur(4px);
            pointer-events: none;

        .placeholder-img {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 10px, #222 10px, #222 20px);
            color: #555;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { margin: 0 0 10px 0; font-size: 1.15em; line-height: 1.3; flex-grow: 1; color: var(--text-light); }
        .price { color: var(--price-color); font-size: 1.5em; font-weight: 700; margin: 0 0 20px 0; }
        
        .buy-btn {

            color: var(--accent-cyan);
            border: 1px solid var(--accent-blue);
            padding: 10px 0;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;

        .product-card:hover .buy-btn { background-color: var(--accent-blue); color: #fff; }

        .lightbox {

            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.98);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        .lightbox.active { display: flex; }

        .lightbox-content {
            position: relative;
            width: 90vw;
            max-width: 1000px;
            max-height: 85vh;
            display: flex;
            flex-direction: row;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);

            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            position: relative;

        #lb-media-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #lb-media-inner img, #lb-media-inner video {

            max-height: 85vh;
            object-fit: contain;
        }

        .lb-details-section {
            width: 400px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: var(--card-bg);
        }

        .lb-details-section h2 { margin-top: 0; font-size: 1.5em; line-height: 1.3; color: var(--text-light); }
        .lb-details-section #lb-price { color: var(--price-color); font-size: 1.8em; font-weight: bold; margin-bottom: 20px; }

        .lb-details-section ul { padding-left: 20px; }
        .lb-details-section li { margin-bottom: 8px; }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            transition: color 0.2s;
            z-index: 10;
        }
        .lb-nav:hover { color: var(--accent-cyan); }
        .lb-prev { left: 15px; }
        .lb-next { right: 15px; }

        .lb-counter {
            position: absolute;
            bottom: 15px;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 1.2em;
            letter-spacing: 2px;
        }

        .lb-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.2s;
            z-index: 10001;
        }
        .lb-close:hover { color: var(--accent-cyan); }

        @media (max-width: 768px) {
            .lightbox-content { flex-direction: column; overflow-y: auto; }
            .lb-media-section { min-height: 40vh; }
            .lb-details-section { width: auto; }
        }
    </style>

        let activeProducts = [];

        function slideCarousel(event, direction) {
            event.stopPropagation();
            const container = event.target.closest('.image-container').querySelector('.image-carousel');
            const scrollAmount = container.offsetWidth;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        let lbMediaArray = [];
        let lbCurrentIndex = 0;
        let currentProduct = null;

        function openLightbox(productId, clickedIndex) {
            currentProduct = activeProducts.find(p => p.id === productId);
            if(!currentProduct) return;
            
            lbMediaArray = currentProduct.media.filter(m => m && !m.includes('assets\\') && m !== "assets");
            if(lbMediaArray.length === 0) return;

            lbCurrentIndex = clickedIndex;
            updateLightboxView();
            
            document.getElementById('lb-title').innerText = currentProduct.name;
            document.getElementById('lb-price').innerText = currentProduct.price;
            document.getElementById('lb-desc').innerHTML = currentProduct.description || "No description available.";

            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lb-media-inner').innerHTML = '';
        }

        function navigateLightbox(direction) {
            lbCurrentIndex += direction;
            if(lbCurrentIndex < 0) lbCurrentIndex = lbMediaArray.length - 1;
            if(lbCurrentIndex >= lbMediaArray.length) lbCurrentIndex = 0;
            updateLightboxView();
        }

        function updateLightboxView() {
            const container = document.getElementById('lb-media-inner');
            const file = lbMediaArray[lbCurrentIndex];
            const filePath = `assets/${file}`;
            
            if(file.endsWith('.mp4')) {
                container.innerHTML = `<video src="${filePath}" controls autoplay playsinline></video>`;
            } else {
                container.innerHTML = `<img src="${filePath}">`;
            }
            
            document.getElementById('lb-counter').innerText = `${lbCurrentIndex + 1} / ${lbMediaArray.length}`;
            
            const arrows = document.querySelectorAll('.lb-nav');
            arrows.forEach(arrow => arrow.style.display = lbMediaArray.length > 1 ? 'block' : 'none');
        }
        
        function initGallery() {
            const gallery = document.getElementById('store-gallery');
            
            activeProducts = spreadsheetData.filter(item => {
                if (!item.active) return false;
                return item.active.trim().toLowerCase() === 'y' || item.active.trim().toLowerCase() === 'yes';
            });
            
            activeProducts.forEach(item => {
                const hasLED = item.name.includes("LED") || item.name.includes("Solar");
                const badgeHTML = hasLED ? `<div class="badge">⚡ LED</div>` : '';
                
                const validMedia = item.media.filter(m => m && !m.includes('assets\\') && m !== "assets");
                
                let carouselHTML = '';
                let arrowsHTML = '';

                if (validMedia.length > 0) {
                    carouselHTML = `<div class="image-carousel">`;
                    validMedia.forEach((file, index) => {
                        const filePath = `assets/${file}`;
                        const clickAction = `onclick="openLightbox('${item.id}', ${index})"`;
                        
                        if(file.endsWith('.mp4')) {
                            carouselHTML += `<video src="${filePath}" class="carousel-item" autoplay loop muted playsinline ${clickAction}></video>`;
                        } else {
                            carouselHTML += `<img src="${filePath}" class="carousel-item" onerror="this.onerror=null; this.src='placeholder.jpg';" ${clickAction}>`;
                        }
                    });
                    carouselHTML += `</div>`;

                    if(validMedia.length > 1) {
                        arrowsHTML = `
                            <button class="nav-btn prev" onclick="slideCarousel(event, -1)">&#10094;</button>
                            <button class="nav-btn next" onclick="slideCarousel(event, 1)">&#10095;</button>
                        `;
                    }
                } else {
                    carouselHTML = `<div class="placeholder-img">Image Coming Soon</div>`;
                }

                const cardHTML = `
                    <div class="product-card">
                        ${badgeHTML}
                        <div class="image-container">
                            ${arrowsHTML}
                            ${carouselHTML}
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${item.name}</h3>
                            <p class="price">${item.price}</p>
                            <button class="buy-btn" onclick="openLightbox('${item.id}', 0)">View Details</button>
                        </div>
                    </div>
                `;
                
                gallery.innerHTML += cardHTML;
            });
        }

        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
