<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>School Spirit Custom Gear | EZ as Tap</title>
    <style>
        /* Core Theme Variables */
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: rgba(19, 27, 46, 0.92);
            --panel-bg: #18233c;
            --accent-blue: #00a2ff;
            --accent-cyan: #00d2ff;
            --text-light: #ecf0f1;
            --text-muted: #8a99ad;
            --border-color: #1e2d4a;
            --price-color: #4dc0b5;
            --accent-glow: rgba(0, 162, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* STICKY COLLAPSIBLE HEADER */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 15, 29, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }

        .brand-link img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-link span {
            color: var(--accent-cyan);
        }

        .nav-menu {
            display: flex;
            align-items: center;
        }

        .nav-list {
            display: flex;
            gap: 1.25rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: var(--accent-cyan);
            background: rgba(0, 162, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.25);
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            flex-direction: column;
            gap: 5px;
        }

        .hamburger-bar {
            width: 24px;
            height: 2px;
            background-color: var(--text-light);
            border-radius: 2px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        @media (max-width: 768px) {
            .nav-toggle {
                display: flex;
            }

            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(10, 15, 29, 0.98);
                border-bottom: 1px solid var(--border-color);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-menu.open {
                max-height: 260px;
            }

            .nav-list {
                flex-direction: column;
                padding: 15px 20px;
                gap: 10px;
                width: 100%;
            }

            .nav-link {
                display: block;
                padding: 10px 14px;
            }

            .nav-toggle.active .hamburger-bar:nth-child(1) {
                transform: translateY(7px) rotate(45deg);
            }
            .nav-toggle.active .hamburger-bar:nth-child(2) {
                opacity: 0;
            }
            .nav-toggle.active .hamburger-bar:nth-child(3) {
                transform: translateY(-7px) rotate(-45deg);
            }
        }

        /* HERO & PARALLAX VIDEO CONTAINER */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .parallax-video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .parallax-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            will-change: transform;
            transition: transform 0.05s linear;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10, 15, 29, 0.5) 0%, rgba(10, 15, 29, 0.88) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 900px;
            padding: 25px 20px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .logo-wrapper {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 220px;
            max-width: 100%;
            height: auto;
            display: block;
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 95%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 95%);
            filter: drop-shadow(0 0 15px rgba(0, 162, 255, 0.3));
        }

        .hero-text {
            text-align: left;
            flex: 1;
        }

        h1 {
            color: var(--accent-blue);
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            opacity: 0.95;
        }

        @media (max-width: 650px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
                gap: 15px;
                padding: 30px 15px;
            }

            .hero-text {
                text-align: center;
            }

            .logo {
                width: 170px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }
        }

        /* CONTAINER & GALLERY */
        .container {
            max-width: 1300px;
            margin: 20px auto 50px auto;
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), 0 0 10px var(--accent-glow);
        }

        .image-container {
            width: 100%;
            height: 280px;
            position: relative;
            background-color: #111;
        }

        .image-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }
        
        .image-carousel::-webkit-scrollbar { display: none; }

        .carousel-item {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: bottom; 
            scroll-snap-align: start;
            cursor: zoom-in;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            backdrop-filter: blur(2px);
            transition: background 0.2s;
        }

        .nav-btn:hover { background: var(--accent-blue); border-color: var(--accent-blue); }
        .nav-btn.prev { left: 8px; }
        .nav-btn.next { right: 8px; }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(0,0,0,0.8);
            color: var(--price-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            border: 1px solid var(--price-color);
            z-index: 4;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .placeholder-img {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 10px, #222 10px, #222 20px);
            color: #555;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { margin: 0 0 10px 0; font-size: 1.15em; line-height: 1.3; flex-grow: 1; color: var(--text-light); }
        .price { color: var(--price-color); font-size: 1.5em; font-weight: 700; margin: 0 0 20px 0; }
        
        .buy-btn {
            background-color: transparent;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-blue);
            padding: 10px 0;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .product-card:hover .buy-btn { background-color: var(--accent-blue); color: #fff; }

        /* LIGHTBOX STYLES */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.98);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active { display: flex; }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .lightbox-content img, .lightbox-content video {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lb-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.2s;
            z-index: 10000;
        }
        .lb-close:hover { color: var(--accent-cyan); }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            transition: color 0.2s;
            z-index: 10000;
        }
        .lb-nav:hover { color: var(--accent-cyan); }
        .lb-prev { left: 10px; }
        .lb-next { right: 10px; }

        .lb-counter {
            position: absolute;
            bottom: 30px;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 1.2em;
            letter-spacing: 2px;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <!-- STICKY SITE HEADER WITH COLLAPSIBLE MENU -->
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand-link">
                <img src="EZ-logo-color.png" alt="EZ as Tap">
                EZ as <span>Tap</span>
            </a>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>

            <nav class="nav-menu" id="navMenu">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Price Calculator</a></li>
                    <li><a href="nfc-catalog.html" class="nav-link">Custom NFC Keychains</a></li>
                    <li><a href="spirit-gallery.html" class="nav-link active">School Spirit Gear</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- HERO HEADER WITH PARALLAX VIDEO BACKGROUND & FADED LOGO -->
    <div class="hero-section">
        <div class="parallax-video-wrapper">
            <video class="parallax-video" id="heroVideo" autoplay loop muted playsinline>
                <source src="nfc-keychain-hero.mp4" type="video/mp4">
                Your browser does not support video background.
            </video>
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="logo-wrapper">
                <img src="EZ-logo-color.png" alt="EZ as Tap Logo" class="logo">
            </div>
            <div class="hero-text">
                <h1>Custom Spirit Gear</h1>
                <p class="subtitle">Custom LED Pendants, Fan Chains &amp; 3D Printed Accessories</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="store-gallery" class="gallery-grid">
            <!-- JavaScript injects products here -->
        </div>
    </div>

    <!-- The Full-Screen Lightbox Container -->
    <div id="lightbox" class="lightbox">
        <div class="lb-close" onclick="closeLightbox()">&#215;</div>
        <div class="lb-nav lb-prev" onclick="navigateLightbox(-1)">&#10094;</div>
        
        <div class="lightbox-content" id="lb-media-container">
            <!-- Media injected here -->
        </div>
        
        <div class="lb-nav lb-next" onclick="navigateLightbox(1)">&#10095;</div>
        <div class="lb-counter" id="lb-counter">1 / 1</div>
    </div>

    <script>
        // MOBILE NAV TOGGLE
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');

        if (navToggle && navMenu) {
            navToggle.addEventListener('click', () => {
                const isOpen = navMenu.classList.toggle('open');
                navToggle.classList.toggle('active', isOpen);
                navToggle.setAttribute('aria-expanded', isOpen);
            });

            document.addEventListener('click', (e) => {
                if (!navToggle.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('open');
                    navToggle.classList.remove('active');
                    navToggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        // PARALLAX EFFECT FOR HERO VIDEO
        window.addEventListener('scroll', function() {
            const video = document.getElementById('heroVideo');
            if (video) {
                let scrolled = window.scrollY;
                video.style.transform = 'translateY(' + (scrolled * 0.35) + 'px)';
            }
        });

        const spreadsheetData = [
            { 
                id: "MNA-VB-ChMLED-01", name: 'Marina High School "M" Logo - lightup Color LED Chain Blue/Light Blue', price: "$95.00", 
                media: ["M-BLB-LUP-04.jpg", "M-BLB-LUP-03.jpg", "M-BLB-LUP-01.mp4"], active: "y" 
            },
            { 
                id: "MNA-VB-ChMLED-02", name:'Marina High School "M" Logo - Lightup Color LED with Chain - Blue/Yellow', price: "$95.00", 
                media: ["M-BY-LUP-01.jpg", "M-BY-LUP-02.mp4"], active: "y" 
            },
            { 
                id: "MNA-VB-ChMSLR-01", name:'Marina High School "M" Logo - Lightup White LED with Chain - Blue/Light Blue', price: "$75.00", 
                media: ["M-BLB-SLR-01-d.jpg", "M-BLB-SLR-01-l.jpg"], active: "y" 
            },
            { 
                id: "MNA-FTB-ChFCE-01", name: 'Marina Hogh School Logo with Chain', price: "$65.00", 
                media: ["FCE-CHN-01-r.jpg", "FCE-CHN-01-l.jpg"], active: "y" 
            },
            { 
                id: "MNA-FTB-M-01", name: 'Marina "M" Logo without chain', price: "$40.00", media: ["BLB-SLR-01.jpg"], active: "y" },
            { 
                id: "MNA-VB-KYCh-01", name: 'Volleyball Keychain with Marina "M" logo', price: "$20.00", media: [], active: "n" }
        ];

        let activeProducts = [];

        function slideCarousel(event, direction) {
            event.stopPropagation();
            const container = event.target.closest('.image-container').querySelector('.image-carousel');
            const scrollAmount = container.offsetWidth;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        let lbMediaArray = [];
        let lbCurrentIndex = 0;

        function openLightbox(productId, clickedIndex) {
            const product = activeProducts.find(p => p.id === productId);
            if(!product) return;
            
            lbMediaArray = product.media.filter(m => m && !m.includes('assets\\') && m !== "assets");
            if(lbMediaArray.length === 0) return;

            lbCurrentIndex = clickedIndex;
            updateLightboxView();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lb-media-container').innerHTML = '';
        }

        function navigateLightbox(direction) {
            lbCurrentIndex += direction;
            if(lbCurrentIndex < 0) lbCurrentIndex = lbMediaArray.length - 1;
            if(lbCurrentIndex >= lbMediaArray.length) lbCurrentIndex = 0;
            updateLightboxView();
        }

        function updateLightboxView() {
            const container = document.getElementById('lb-media-container');
            const file = lbMediaArray[lbCurrentIndex];
            const filePath = `assets/${file}`;
            
            if(file.endsWith('.mp4')) {
                container.innerHTML = `<video src="${filePath}" controls autoplay playsinline></video>`;
            } else {
                container.innerHTML = `<img src="${filePath}">`;
            }
            
            document.getElementById('lb-counter').innerText = `${lbCurrentIndex + 1} / ${lbMediaArray.length}`;
            
            const arrows = document.querySelectorAll('.lb-nav');
            arrows.forEach(arrow => arrow.style.display = lbMediaArray.length > 1 ? 'block' : 'none');
        }

        function initGallery() {
            const gallery = document.getElementById('store-gallery');
            
            activeProducts = spreadsheetData.filter(item => {
                if (!item.active) return false;
                return item.active.trim().toLowerCase() === 'y' || item.active.trim().toLowerCase() === 'yes';
            });
            
            activeProducts.forEach(item => {
                const hasLED = item.name.includes("LED") || item.name.includes("Solar");
                const badgeHTML = hasLED ? `<div class="badge">⚡ LED</div>` : '';
                
                const validMedia = item.media.filter(m => m && !m.includes('assets\\') && m !== "assets");
                
                let carouselHTML = '';
                let arrowsHTML = '';

                if (validMedia.length > 0) {
                    carouselHTML = `<div class="image-carousel">`;
                    validMedia.forEach((file, index) => {
                        const filePath = `assets/${file}`;
                        const clickAction = `onclick="openLightbox('${item.id}', ${index})"`;
                        
                        if(file.endsWith('.mp4')) {
                            carouselHTML += `<video src="${filePath}" class="carousel-item" autoplay loop muted playsinline ${clickAction}></video>`;
                        } else {
                            carouselHTML += `<img src="${filePath}" class="carousel-item" onerror="this.onerror=null; this.src='placeholder.jpg';" ${clickAction}>`;
                        }
                    });
                    carouselHTML += `</div>`;

                    if(validMedia.length > 1) {
                        arrowsHTML = `
                            <button class="nav-btn prev" onclick="slideCarousel(event, -1)">&#10094;</button>
                            <button class="nav-btn next" onclick="slideCarousel(event, 1)">&#10095;</button>
                        `;
                    }
                } else {
                    carouselHTML = `<div class="placeholder-img">Image Coming Soon</div>`;
                }

                const cardHTML = `
                    <div class="product-card">
                        ${badgeHTML}
                        <div class="image-container">
                            ${arrowsHTML}
                            ${carouselHTML}
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${item.name}</h3>
                            <p class="price">${item.price}</p>
                            <button class="buy-btn" onclick="openLightbox('${item.id}', 0)">View Details</button>
                        </div>
                    </div>
                `;
                
                gallery.innerHTML += cardHTML;
            });
        }

        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
