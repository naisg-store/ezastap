<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Spirit Custom Gear | EZ as Tap</title>
    <style>
        /* Core Theme Variables */
        :root {
            --bg-dark: #0f1014;
            --bg-card: #1c1d24;
            --accent: #4F81BD;
            --accent-glow: rgba(79, 129, 189, 0.4);
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --border: #333440;
            --price-color: #4dc0b5;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(28,29,36,1) 0%, rgba(15,16,20,1) 100%);
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 2.2em;
            text-transform: uppercase;
        }

        header p { color: var(--text-muted); margin-top: 5px; }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Card Setup */
        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), 0 0 10px var(--accent-glow);
        }

        /* Swiping Carousel Setup */
        .image-container {
            width: 100%;
            height: 280px;
            position: relative;
            background-color: #111;
        }

        .image-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE */
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }
        
        .image-carousel::-webkit-scrollbar { display: none; /* Chrome/Safari */ }

        .carousel-item {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            /* This fixes your crop issue! Anchors to bottom, crops the top */
            object-fit: cover;
            object-position: bottom; 
            scroll-snap-align: start;
            cursor: zoom-in; /* Tells user they can click to expand */
        }

        /* Mini Nav Arrows for Cards */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            backdrop-filter: blur(2px);
            transition: background 0.2s;
        }

        .nav-btn:hover { background: var(--accent); border-color: var(--accent); }
        .nav-btn.prev { left: 8px; }
        .nav-btn.next { right: 8px; }

        /* Badges & Fallbacks */
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(0,0,0,0.8);
            color: var(--price-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            border: 1px solid var(--price-color);
            z-index: 4;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .placeholder-img {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 10px, #222 10px, #222 20px);
            color: #555;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Product Details */
        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { margin: 0 0 10px 0; font-size: 1.15em; line-height: 1.3; flex-grow: 1; }
        .price { color: var(--price-color); font-size: 1.5em; font-weight: 700; margin: 0 0 20px 0; }
        
        .buy-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 0;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .product-card:hover .buy-btn { background-color: var(--accent); color: #fff; }

        /* Full Screen Lightbox Styling */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.98);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active { display: flex; }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content img, .lightbox-content video {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .lb-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.2s;
            z-index: 10000;
        }
        .lb-close:hover { color: var(--accent); }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            transition: color 0.2s;
        }
        .lb-nav:hover { color: var(--accent); }
        .lb-prev { left: 10px; }
        .lb-next { right: 10px; }

        .lb-counter {
            position: absolute;
            bottom: 30px;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 1.2em;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Custom Spirit Gear</h1>
        <p>Premium 3D Printed Hardware</p>
    </header>

    <div class="container">
        <div id="store-gallery" class="gallery-grid">
            <!-- JavaScript injects products here -->
        </div>
    </div>

    <!-- The Full-Screen Lightbox Container -->
    <div id="lightbox" class="lightbox">
        <div class="lb-close" onclick="closeLightbox()">&#215;</div>
        <div class="lb-nav lb-prev" onclick="navigateLightbox(-1)">&#10094;</div>
        
        <div class="lightbox-content" id="lb-media-container">
            <!-- Media injected here -->
        </div>
        
        <div class="lb-nav lb-next" onclick="navigateLightbox(1)">&#10095;</div>
        <div class="lb-counter" id="lb-counter">1 / 1</div>
    </div>

    <script>
        const spreadsheetData = [
            { 
                id: "MNA-VB-ChMLED-01", name: 'Volleyball LED Chain "M" Blue/Light Blue', price: "$115.00", 
                media: ["M-BLB-LUP-04.jpg", "M-BLB-LUP-03.jpg", "M-BLB-LUP-01.mp4"], active: "y" 
            },
            { 
                id: "MNA-VB-ChMLED-02", name: 'Volleyball LED Chain "M" Blue/Yellow', price: "$135.00", 
                media: ["M-BY-LUP-01.jpg", "M-BY-LUP-02.mp4"], active: "y" 
            },
            { 
                id: "MNA-VB-ChMSLR-01", name: 'Volleyball SolarLED Chain "M" Blue/Light Blue', price: "$115.00", 
                media: ["M-BLB-SLR-01-d.jpg", "M-BLB-SLR-01-l.jpg"], active: "y" 
            },
            { 
                id: "MNA-FTB-ChFCE-01", name: 'Football Chain w/ Mascot Head', price: "$65.00", 
                media: ["FCE-CHN-01-r.jpg", "FCE-CHN-01-l.jpg"], active: "y" 
            },
            { 
                id: "MNA-FTB-M-01", name: 'Marina "M" Logo w/out chain', price: "$35.00", media: [], active: "n" },
            { 
                id: "MNA-VB-KYCh-01", name: 'Volleyball Keychain with M logo', price: "$20.00", media: [], active: "n" }
        ];

        let activeProducts = [];

        // Slides the mini-carousel left or right when clicking arrows
        function slideCarousel(event, direction) {
            event.stopPropagation(); // Prevents the lightbox from opening
            const container = event.target.closest('.image-container').querySelector('.image-carousel');
            const scrollAmount = container.offsetWidth; // slide exactly one image width
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        // ---- LIGHTBOX LOGIC ----
        let lbMediaArray = [];
        let lbCurrentIndex = 0;

        function openLightbox(productId, clickedIndex) {
            const product = activeProducts.find(p => p.id === productId);
            if(!product) return;
            
            // Get valid media
            lbMediaArray = product.media.filter(m => m && !m.includes('assets\\') && m !== "assets");
            if(lbMediaArray.length === 0) return; // Ignore if no images

            lbCurrentIndex = clickedIndex;
            updateLightboxView();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lb-media-container').innerHTML = ''; // Stops videos from playing in background
        }

        function navigateLightbox(direction) {
            lbCurrentIndex += direction;
            // Loop around if reaching the ends
            if(lbCurrentIndex < 0) lbCurrentIndex = lbMediaArray.length - 1;
            if(lbCurrentIndex >= lbMediaArray.length) lbCurrentIndex = 0;
            updateLightboxView();
        }

        function updateLightboxView() {
            const container = document.getElementById('lb-media-container');
            const file = lbMediaArray[lbCurrentIndex];
            const filePath = `assets/${file}`;
            
            if(file.endsWith('.mp4')) {
                container.innerHTML = `<video src="${filePath}" controls autoplay playsinline></video>`;
            } else {
                container.innerHTML = `<img src="${filePath}">`;
            }
            
            document.getElementById('lb-counter').innerText = `${lbCurrentIndex + 1} / ${lbMediaArray.length}`;
            
            // Hide arrows if only 1 image
            const arrows = document.querySelectorAll('.lb-nav');
            arrows.forEach(arrow => arrow.style.display = lbMediaArray.length > 1 ? 'block' : 'none');
        }

        // ---- BUILD THE GALLERY ----
        function initGallery() {
            const gallery = document.getElementById('store-gallery');
            
            // Filter active items
            activeProducts = spreadsheetData.filter(item => {
                if (!item.active) return false;
                return item.active.trim().toLowerCase() === 'y' || item.active.trim().toLowerCase() === 'yes';
            });
            
            activeProducts.forEach(item => {
                const hasLED = item.name.includes("LED") || item.name.includes("Solar");
                const badgeHTML = hasLED ? `<div class="badge">⚡ LED</div>` : '';
                
                const validMedia = item.media.filter(m => m && !m.includes('assets\\') && m !== "assets");
                
                let carouselHTML = '';
                let arrowsHTML = '';

                if (validMedia.length > 0) {
                    carouselHTML = `<div class="image-carousel">`;
                    validMedia.forEach((file, index) => {
                        const filePath = `assets/${file}`;
                        // Add click event to open Lightbox
                        const clickAction = `onclick="openLightbox('${item.id}', ${index})"`;
                        
                        if(file.endsWith('.mp4')) {
                            carouselHTML += `<video src="${filePath}" class="carousel-item" autoplay loop muted playsinline ${clickAction}></video>`;
                        } else {
                            carouselHTML += `<img src="${filePath}" class="carousel-item" onerror="this.src='placeholder.jpg'" ${clickAction}>`;
                        }
                    });
                    carouselHTML += `</div>`;

                    // Only add mini arrows if there is more than 1 image
                    if(validMedia.length > 1) {
                        arrowsHTML = `
                            <button class="nav-btn prev" onclick="slideCarousel(event, -1)">&#10094;</button>
                            <button class="nav-btn next" onclick="slideCarousel(event, 1)">&#10095;</button>
                        `;
                    }
                } else {
                    carouselHTML = `<div class="placeholder-img">Image Coming Soon</div>`;
                }

                const cardHTML = `
                    <div class="product-card">
                        ${badgeHTML}
                        <div class="image-container">
                            ${arrowsHTML}
                            ${carouselHTML}
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${item.name}</h3>
                            <p class="price">${item.price}</p>
                            <button class="buy-btn">Inquire / Quote</button>
                        </div>
                    </div>
                `;
                
                gallery.innerHTML += cardHTML;
            });
        }

        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
